<VirtualHost *:8085>
    ServerName dulcehogar.local
    DocumentRoot /var/www/dulcehogar.local

    <Directory /var/www/dulcehogar.local>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://172.25.64.1:9095/api
    ProxyPassReverse /api http://172.25.64.1:9095/api

    ErrorLog ${APACHE_LOG_DIR}/dulcehogar.local-error.log
    CustomLog ${APACHE_LOG_DIR}/dulcehogar.local-access.log combined
</VirtualHost>

<VirtualHost *:8443>
    ServerName dulcehogar.local
    DocumentRoot /var/www/dulcehogar.local

    SSLEngine on
    SSLCertificateFile /home/edgar_bermudez/gsw-lab2-EdgarBermudez/config/certs/dulcehogar.local.pem
    SSLCertificateKeyFile /home/edgar_bermudez/gsw-lab2-EdgarBermudez/config/certs/dulcehogar.local-key.pem

    <Directory /var/www/dulcehogar.local>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://172.25.64.1:9095/api
    ProxyPassReverse /api http://172.25.64.1:9095/api

    ErrorLog ${APACHE_LOG_DIR}/dulcehogar.local-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/dulcehogar.local-ssl-access.log combined
</VirtualHost>
